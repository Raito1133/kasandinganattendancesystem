<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSU-IIT CSM - Attendance Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="kasanlogo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f4efea;
            color: #27272a;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* TUNAY NA IMG TAG BILANG BUONG BACKGROUND NA MAY BLUR EFFECT */
        .bg-image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10;
            overflow: hidden;
        }

        .bg-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(4px);
            transform: scale(1.05);
        }

        /* BEIGE PANELS NA MAY BLUR SA LIKOD */
        .beige-panel {
            background: rgba(249, 245, 240, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(123, 17, 19, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
        }

        /* CREAM/BEIGE LOGIN PANEL */
        .hero-panel {
            background: rgba(249, 245, 240, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(123, 17, 19, 0.2);
            box-shadow: 0 25px 50px -12px rgba(123, 17, 19, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

    <!-- TUNAY NA BACKGROUND IMAGE GAMIT ANG IMG SRC -->
    <div class="bg-image-container">
        <img src="C:\Users\Vina\Downloads\kasangan.png" alt="Background Banner" onerror="this.style.display='none'">
    </div>

    <!-- MAIN CONTAINER -->
    <div class="w-full flex-grow flex flex-col justify-between">
        
        <!-- HEADER (Parehong-pareho sa Portal) -->
        <header class="w-full bg-[#f9f5f0]/90 backdrop-blur-xl px-6 py-4 shadow-md z-40">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                
                <!-- Left Section: Lynx Logo & Titles -->
                <div class="flex items-center gap-4">
                    <div class="w-20 h-20 flex-shrink-0 flex items-center justify-center">
                        <img src="lynxlogo.png" alt="Lynx Logo" class="w-full h-full object-contain" onerror="this.src='kasanlogo.jpg'">
                    </div>
                    <div>
                        <span class="text-[11px] font-extrabold text-[#7B1113] tracking-widest uppercase">MINDANAO STATE UNIVERSITY - ILIGAN INSTITUTE OF TECHNOLOGY</span>
                        <h1 class="text-2xl md:text-3xl font-black text-[#7B1113] tracking-tight leading-none my-1">COLLEGE OF SCIENCE AND MATHEMATICS</h1>
                        <h2 class="text-sm font-black text-[#7B1113] tracking-wider uppercase">STUDENT COUNCIL</h2>
                    </div>
                </div>

                <!-- Right Section: 5 Borderless Logos with Labels -->
                <div class="hidden xl:flex items-center gap-6 flex-wrap justify-end">
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 overflow-hidden flex items-center justify-center"><img src="haynayan.jpg" class="w-full h-full object-contain rounded-full" onerror="this.style.display='none'"></div>
                        <span class="text-[10px] font-extrabold text-[#7B1113] mt-1.5 tracking-wider">HAYNAYAN</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 overflow-hidden flex items-center justify-center"><img src="statmath.jpg" class="w-full h-full object-contain rounded-full" onerror="this.style.display='none'"></div>
                        <span class="text-[10px] font-extrabold text-[#7B1113] mt-1.5 tracking-wider">STATMATH</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 overflow-hidden flex items-center justify-center"><img src="massts.jpg" class="w-full h-full object-contain rounded-full" onerror="this.style.display='none'"></div>
                        <span class="text-[10px] font-extrabold text-[#7B1113] mt-1.5 tracking-wider">MASSTS</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 overflow-hidden flex items-center justify-center"><img src="kmp.jpg" class="w-full h-full object-contain rounded-full" onerror="this.style.display='none'"></div>
                        <span class="text-[10px] font-extrabold text-[#7B1113] mt-1.5 tracking-wider">KMP</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 overflow-hidden flex items-center justify-center"><img src="chemistry.jpg" class="w-full h-full object-contain rounded-full" onerror="this.style.display='none'"></div>
                        <span class="text-[10px] font-extrabold text-[#7B1113] mt-1.5 tracking-wider">CHEMISTRY</span>
                    </div>
                </div>

            </div>

            <!-- Subheader Line -->
            <div class="max-w-7xl mx-auto mt-3 pt-2 flex items-center text-xs font-semibold text-[#7B1113] gap-6">
                <span class="text-xs italic text-[#7B1113] font-serif">excellentia est norma</span>

                <div class="flex items-center">
                    <div class="w-[400px] flex h-[3px]">
                        <div class="w-[75%] bg-[#7B1113]"></div>
                        <div class="w-[25%] bg-amber-400"></div>
                    </div>
                </div>

                <span class="whitespace-nowrap">csm.sc@g.msuiit.edu.ph</span>
            </div>
        </header>

        <!-- LOGIN CONTENT CENTERED -->
        <main class="max-w-md mx-auto px-6 py-12 w-full flex items-center justify-center flex-grow">
            <div class="hero-panel rounded-3xl p-8 text-zinc-900 shadow-2xl relative overflow-hidden border border-[#7B1113]/25 w-full">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-[#7B1113]/5 rounded-full pointer-events-none"></div>
                
                <div class="text-center mb-6">
                    <!-- Pinalitan ang lock icon ng lynxlogo.png -->
                    <div class="w-16 h-16 bg-[#f9f5f0] rounded-2xl flex items-center justify-center overflow-hidden shadow-inner mx-auto mb-3 border border-[#7B1113]/20 p-1.5">
                        <img src="lynxlogo.png" alt="Portal Logo" class="w-full h-full object-contain" onerror="this.src='kasanlogo.jpg'">
                    </div>
                    <h3 class="text-xl font-extrabold tracking-tight text-[#7B1113]">Kasandigan Attendance Portal</h3>
                    <p class="text-xs text-zinc-600 mt-1">Please enter your admin account.</p>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-[#7B1113] uppercase tracking-wider">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-zinc-400">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="usernameInput" required placeholder="Enter username" 
                                class="w-full pl-11 pr-4 py-3 bg-white text-zinc-900 rounded-2xl focus:outline-none focus:ring-4 focus:ring-[#7B1113]/20 font-semibold text-sm shadow-inner placeholder:text-zinc-400 border border-zinc-200">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-[#7B1113] uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-zinc-400">
                                <i class="fa-solid fa-key"></i>
                            </span>
                            <input type="password" id="passwordInput" required placeholder="Enter password" 
                                class="w-full pl-11 pr-4 py-3 bg-white text-zinc-900 rounded-2xl focus:outline-none focus:ring-4 focus:ring-[#7B1113]/20 font-semibold text-sm shadow-inner placeholder:text-zinc-400 border border-zinc-200">
                        </div>
                    </div>

                    <!-- Portal Destination Selector -->
                    <div class="space-y-1 pt-1">
                        <label class="block text-xs font-bold text-[#7B1113] uppercase tracking-wider">Select Portal Destination</label>
                        <select id="portalDestination" class="w-full px-4 py-3 bg-white text-zinc-900 rounded-2xl focus:outline-none focus:ring-4 focus:ring-[#7B1113]/20 font-semibold text-sm shadow-inner border border-zinc-200">
                            <option value="collegeportal.html">Whole College Attendance Portal</option>
                            <option value="councilportal.html">Student Council Attendance Portal</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="w-full bg-[#7B1113] hover:bg-[#5c0c0e] text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-xl transition transform active:scale-95 duration-200 flex items-center justify-center gap-2 text-sm tracking-wide mt-2">
                        <span>Log in</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div id="loginAlert" class="mt-4 hidden p-3 rounded-xl text-xs font-bold text-center bg-red-100 text-red-800 border border-red-300"></div>
            </div>
        </main>

        <!-- 3 BIG LOGOS SA BABA -->
        <div class="max-w-4xl mx-auto px-6 pb-6 pt-2 flex flex-wrap items-center justify-center gap-8">
            <div class="w-24 h-24 rounded-3xl overflow-hidden shadow-xl border-2 border-[#7B1113]/30 bg-white/90 backdrop-blur-md flex items-center justify-center p-2">
                <img src="logo1.png" alt="Big Logo 1" class="w-full h-full object-contain" onerror="this.src='kasanlogo.jpg'">
            </div>
            <div class="w-24 h-24 rounded-3xl overflow-hidden shadow-xl border-2 border-[#7B1113]/30 bg-white/90 backdrop-blur-md flex items-center justify-center p-2">
                <img src="logo2.png" alt="Big Logo 2" class="w-full h-full object-contain" onerror="this.src='msuiitlogo.png">
            </div>
            <div class="w-24 h-24 rounded-3xl overflow-hidden shadow-xl border-2 border-[#7B1113]/30 bg-white/90 backdrop-blur-md flex items-center justify-center p-2">
                <img src="logo3.png" alt="Big Logo 3" class="w-full h-full object-contain" onerror="this.src='csmlogo.png'">
            </div>
        </div>

        <!-- PLAIN FOOTER LETTER -->
        <footer class="w-full py-4 text-center text-xs font-bold text-[#7B1113] tracking-wider bg-transparent">
            By StRaW Usec. John Patrick Navalta
        </footer>

    </div>

    <!-- SCRIPT FOR LOGIN VALIDATION -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const destination = document.getElementById('portalDestination').value;
            const alertBox = document.getElementById('loginAlert');

            // Palitan ang username at password dito kung ano ang gusto mo
            if (user === "csmadmin" && pass === "csm2026") {
                alertBox.classList.add('hidden');
                window.location.href = destination;
            } else {
                alertBox.innerText = "Invalid username or password. Please try again.";
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
